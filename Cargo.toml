[package]
name = "cdsk"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
description = "Storage convergence and instance disks for the VM/GPU system"
repository = "https://git.corbet.ch/corbet-infra/cdsk"

[dependencies]
cdrv = { path = "../cdrv" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lints.rust]
unsafe_code = "forbid"
